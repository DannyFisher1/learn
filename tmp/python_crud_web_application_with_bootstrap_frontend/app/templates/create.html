<!--
This HTML template renders a form for creating a new entity with 'name' and 'description' fields.
The form submits a POST request to the '/create' endpoint.
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create New Entity</title>
</head>
<body>
  <h1>Create a New Entity</h1>
  <form action="/create" method="post">
    <label for="name">Name:</label><br />
    <input type="text" id="name" name="name" required /><br /><br />

    <label for="description">Description:</label><br />
    <textarea id="description" name="description" rows="4" cols="50"></textarea><br /><br />

    <button type="submit">Create</button>
  </form>
</body>
</html>
